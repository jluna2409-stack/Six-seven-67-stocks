<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Bolsa Sim — Simulador de inversión</title>
<link rel="stylesheet" href="./styles/app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
</head>
<body>
  <div id="boot" class="boot"><div class="boot-logo">📈</div><div class="boot-text">Cargando…</div></div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-in">
        <div class="brand"><span class="brand-mark">📈</span><span class="brand-name">Bolsa Sim</span></div>
        <div class="topbar-right">
          <span id="mkt-status" class="mkt-pill" title=""><i class="dot"></i><span></span></span>
          <button class="icon-btn" id="btn-lang" title="ES / EN">ES</button>
          <button class="icon-btn" id="btn-theme" title="Theme">◐</button>
        </div>
      </div>
    </header>

    <nav class="tabbar" id="tabbar"><div class="tabbar-in">
      <button data-tab="dashboard"><span class="ti">◎</span><span class="tl" data-i18n="nav.dashboard">Resumen</span></button>
      <button data-tab="portfolio"><span class="ti">▤</span><span class="tl" data-i18n="nav.portfolio">Cartera</span></button>
      <button data-tab="trade"><span class="ti">⇄</span><span class="tl" data-i18n="nav.trade">Operar</span></button>
      <button data-tab="cash"><span class="ti">$</span><span class="tl" data-i18n="nav.cash">Efectivo</span></button>
      <button data-tab="taxes"><span class="ti">%</span><span class="tl" data-i18n="nav.taxes">Impuestos</span></button>
      <button data-tab="history"><span class="ti">≡</span><span class="tl" data-i18n="nav.history">Historial</span></button>
      <button data-tab="settings"><span class="ti">⚙</span><span class="tl" data-i18n="nav.settings">Ajustes</span></button>
    </div></nav>

    <main id="view" class="view"></main>

  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
